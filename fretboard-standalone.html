<body class="square-ui fb-standalone">
    <div class="app-container">
        <aside class="sidebar">
            <!-- removed static sidebar sections content (moved to app-ui-sidebar.js) -->

        <main class="main-content">
            <header class="top-header">
                <div class="top-header-content">
                    <!-- Reset button removed from absolute position; moved into header content -->

                    </nav>

                        </button>

                        </button>

            <section class="fretboard-container" aria-label="Fretboard diagrams">
                <div id="fretboard" role="region" aria-label="Interactive fretboard, strings ordered lowest to highest" tabindex="0"></div>
                <div id="current-pattern-display" class="current-pattern-display" aria-label="Selected diagram actions"></div>
                <details class="fb-setup" id="fb-setup">
                    <summary>Setup</summary>
                    <div id="fb-controls"></div>
                </details>
                <script>
                    (function () {
                        // The app builds its controls after load. Move the existing nodes (not copies) so their listeners stay attached.
                        const dock = document.getElementById('fb-controls');
                        // Format and scope select plus Create export. It forwards to the Export tab's own select and button, so those handlers run unchanged.
                        const createExportGroup = (source, sourceButton) => {
                            const group = document.createElement('fieldset');
                            group.id = 'fb-export';
                            const legend = document.createElement('legend');
                            legend.textContent = 'Export';
                            const label = document.createElement('label');
                            label.textContent = 'Format and scope:';
                            const select = source.cloneNode(true);
                            select.removeAttribute('id');
                            select.removeAttribute('style');
                            select.removeAttribute('aria-describedby');
                            select.value = source.value;
                            label.appendChild(select);
                            const button = document.createElement('button');
                            button.type = 'button';
                            button.textContent = 'Create export';
                            button.addEventListener('click', () => {
                                source.value = select.value;
                                sourceButton.click();
                            });
                            group.append(legend, label, button);
                            return group;
                        };
                        // Standalone only: one string row at a time in Selected diagram, chosen by a String picker. All rows stay in the DOM, so the app's per-string reads and writes are unchanged.
                        const syncStringPicker = () => {
                            const strings = document.getElementById('instrument-strings');
                            const container = document.getElementById('tuning-container');
                            if (!strings || !container) return;
                            let group = document.getElementById('fb-string-picker-group');
                            if (!group) {
                                group = document.createElement('div');
                                group.id = 'fb-string-picker-group';
                                group.className = 'control-group fb-string-picker';
                                const label = document.createElement('label');
                                label.htmlFor = 'fb-string-picker';
                                label.textContent = 'String:';
                                const select = document.createElement('select');
                                select.id = 'fb-string-picker';
                                select.addEventListener('change', () => syncStringPicker());
                                group.append(label, select);
                            }
                            const select = group.querySelector('select');
                            const rows = Array.from(container.querySelectorAll(':scope > .tuning-input'));
                            const labels = rows.map(row => (row.querySelector('label')?.textContent || '').replace(/:\s*$/, ''));
                            const key = labels.join('|');
                            if (select.dataset.labels !== key) {
                                const previous = Number(select.value) || 0;
                                select.dataset.labels = key;
                                select.replaceChildren(...labels.map((text, i) => new Option(text, String(i))));
                                select.value = String(Math.min(previous, Math.max(0, labels.length - 1)));
                            }
                            group.hidden = rows.length === 0;
                            if (group.parentElement !== strings || container.previousElementSibling !== group) strings.insertBefore(group, container);
                            const shown = Math.min(Number(select.value) || 0, Math.max(0, rows.length - 1));
                            rows.forEach((row, i) => { row.hidden = i !== shown; });
                        };
                        // Output: which details the exported image shows, plus optional header and footer text. Checkboxes forward to the Export and Appearance controls, and text is saved by Exporter, so the export code is unchanged.
                        const createOutputGroup = () => {
                            const exportText = () => (window.Exporter && Exporter.exportText) ? Exporter.exportText() : {};
                            const group = document.createElement('fieldset');
                            group.id = 'fb-export-output';
                            const legend = document.createElement('legend');
                            legend.textContent = 'Output';
                            const checkRow = document.createElement('div');
                            checkRow.className = 'fb-output-checks';
                            const checks = [
                                ['Info label', '#export-include-info'],
                                ['Key and pattern only', '#export-simple-info'],
                                ['Instrument', '[data-label-field="instrument"]'],
                                ['Tuning', '[data-label-field="tuning"]'],
                                ['Key', '[data-label-field="key"]'],
                                ['Type', '[data-label-field="type"]'],
                                ['Name', '[data-label-field="name"]'],
                                ['Formula', '[data-label-field="formula"]']
                            ];
                            const boxes = checks.map(([text, selector]) => {
                                const label = document.createElement('label');
                                label.className = 'fb-output-check';
                                const box = document.createElement('input');
                                box.type = 'checkbox';
                                box.addEventListener('change', () => {
                                    const source = document.querySelector(selector);
                                    if (!source) return;
                                    source.checked = box.checked;
                                    source.dispatchEvent(new Event('change', { bubbles: true }));
                                });
                                label.append(box, document.createTextNode(text));
                                checkRow.append(label);
                                return { box, selector };
                            });
                            const textRow = document.createElement('div');
                            textRow.className = 'fb-output-texts';
                            const texts = [['Header text', 'header'], ['Footer text', 'footer']].map(([text, field]) => {
                                const label = document.createElement('label');
                                label.textContent = text;
                                const input = document.createElement('input');
                                input.type = 'text';
                                input.maxLength = 80;
                                input.addEventListener('input', () => { if (window.Exporter && Exporter.setExportText) Exporter.setExportText(field, input.value); });
                                label.append(input);
                                textRow.append(label);
                                return { input, field };
                            });
                            group.refresh = () => {
                                const saved = exportText();
                                boxes.forEach(({ box, selector }) => { const source = document.querySelector(selector); if (source) box.checked = source.checked; });
                                texts.forEach(({ input, field }) => { if (document.activeElement !== input) input.value = saved[field] || ''; });
                            };
                            group.addEventListener('pointerover', () => group.refresh());
                            group.append(legend, checkRow, textRow);
                            group.refresh();
                            return group;
                        };
                        // Standalone only: each Setup card is a collapsed <details>. The card element itself moves unchanged, so its listeners stay attached.
                        const card = (el, title) => {
                            let wrap = el.parentElement;
                            if (!wrap || !wrap.classList.contains('fb-card')) {
                                wrap = document.createElement('details');
                                wrap.className = 'fb-card';
                                wrap.append(document.createElement('summary'));
                                el.before(wrap);
                                wrap.append(el);
                            }
                            const summary = wrap.querySelector(':scope > summary');
                            const text = title || el.querySelector(':scope > legend')?.textContent.trim() || '';
                            if (summary.textContent !== text) summary.textContent = text;
                            return wrap;
                        };
                        const moveControls = () => {
                            // Setup order: Instrument settings, Key/Type/Selection rows (kept in diagram order), Diagram set, Export, Play through keys, Slideshow playback, Slideshow files.
                            const order = [];
                            const instrumentFooter = document.getElementById('instrument-footer');
                            if (instrumentFooter) order.push(instrumentFooter);
                            if (instrumentFooter) instrumentFooter.querySelectorAll(':scope > fieldset.instrument-control-section').forEach(el => card(el));
                            document.querySelectorAll('#additional-diagram-strings > .diagram-string-options').forEach(el => card(el));
                            const patternControls = Array.from(document.querySelectorAll('.diagram-pattern-controls'));
                            patternControls.forEach((el, i) => order.push(card(el, patternControls.length > 1 ? 'Diagram ' + (i + 1) + ' - Key, type and selection' : 'Key, type and selection')));
                            const diagramSet = document.getElementById('instrument-diagrams');
                            if (diagramSet) order.push(card(diagramSet));
                            // Format and scope select plus Create export. It forwards to the Export tab's own select and button, so those handlers run unchanged.
                            let exportGroup = document.getElementById('fb-export');
                            const exportSource = document.getElementById('export-action-select');
                            const exportButton = document.getElementById('export-play-button');
                            if (!exportGroup && exportSource && exportButton) exportGroup = createExportGroup(exportSource, exportButton);
                            if (exportGroup) order.push(card(exportGroup));
                            let outputGroup = document.getElementById('fb-export-output');
                            if (!outputGroup && exportSource && document.getElementById('export-include-info')) outputGroup = createOutputGroup();
                            if (outputGroup) { order.push(card(outputGroup)); outputGroup.refresh(); }
                            ['board-key-loops', 'board-slideshow', 'board-slideshow-files'].forEach(id => {
                                const section = document.getElementById(id);
                                if (section) order.push(card(section));
                            });
                            let previous = null;
                            order.forEach(el => {
                                const expected = previous ? previous.nextElementSibling : dock.firstElementChild;
                                if (el.parentElement !== dock || el !== expected) { if (previous) previous.after(el); else dock.prepend(el); }
                                previous = el;
                            });
                            const panel = document.getElementById('fretboard-controls-dock');
                            if (panel) {
                                // Advanced is the last item in Setup, collapsed by default. It holds the full control panel (Board & Playback, Appearance, Export, New UI).
                                let advanced = document.getElementById('fb-advanced');
                                if (!advanced) {
                                    advanced = document.createElement('details');
                                    advanced.id = 'fb-advanced';
                                    advanced.className = 'fb-advanced';
                                    const summary = document.createElement('summary');
                                    summary.textContent = 'Advanced';
                                    advanced.append(summary);
                                }
                                if (dock.lastElementChild !== advanced) dock.appendChild(advanced);
                                if (panel.parentElement !== advanced) {
                                    advanced.appendChild(panel);
                                    panel.style.display = '';
                                    document.getElementById('fretboard-tab-board')?.click();
                                }
                            }
                        };
                        // Advanced: each control panel is a collapsed card, and each section in it is a collapsed card too (the same pattern as Setup).
                        const wrapAdvanced = () => {
                            const advanced = document.getElementById('fb-advanced');
                            if (!advanced) return;
                            [['controls-bottom', 'Board & Playback'], ['appearance-footer', 'Appearance'], ['export-footer', 'Export'], ['new-ui-footer', 'New UI']].forEach(([id, title]) => {
                                const pane = document.getElementById(id);
                                if (!pane || !advanced.contains(pane)) return;
                                card(pane, title);
                                pane.querySelectorAll(':scope > fieldset').forEach(el => card(el));
                            });
                            // New UI card sits directly under Appearance.
                            const appearanceCard = document.getElementById('appearance-footer')?.parentElement;
                            const newUiCard = document.getElementById('new-ui-footer')?.parentElement;
                            if (appearanceCard?.classList.contains('fb-card') && newUiCard?.classList.contains('fb-card') && appearanceCard.nextElementSibling !== newUiCard) appearanceCard.after(newUiCard);
                            // Expand all / Collapse all under the Advanced summary. Opens every card if any is closed, otherwise closes them all.
                            const cardsIn = () => Array.from(advanced.querySelectorAll('details.fb-card'));
                            let toggle = advanced.querySelector(':scope > button.fb-expand-all');
                            if (!toggle) {
                                toggle = document.createElement('button');
                                toggle.type = 'button';
                                toggle.className = 'fb-expand-all';
                                toggle.addEventListener('click', () => {
                                    const cards = cardsIn();
                                    const openAll = cards.some(c => !c.open);
                                    cards.forEach(c => { c.open = openAll; });
                                    wrapAdvanced();
                                });
                                advanced.querySelector(':scope > summary').after(toggle);
                            }
                            const label = cardsIn().length && cardsIn().every(c => c.open) ? 'Collapse all' : 'Expand all';
                            if (toggle.textContent !== label) toggle.textContent = label;
                        };
                        const runControls = () => { moveControls(); wrapAdvanced(); syncStringPicker(); };
                        new MutationObserver(runControls).observe(document.body, { childList: true, subtree: true });
                        runControls();
                    })();
                </script>
            </section>

                <div id="slideshow-items"></div>
            </div>

                <div id="generated-patterns"></div>
            </div>
