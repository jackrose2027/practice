                        <button id="header-play-pattern" type="button" class="header-play-pattern" title="Play selected pattern" aria-label="Play selected pattern">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><path d="M7 4.5a1 1 0 0 1 1.5-.86l11 7.5a1 1 0 0 1 0 1.72l-11 7.5A1 1 0 0 1 7 19.5z"/></svg>
                        </button>
                        <button id="header-stop-pattern" type="button" class="header-stop-pattern" title="Stop fretboard playback" aria-label="Stop fretboard playback" disabled>
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                        </button>
                        <button id="sidebar-toggle" aria-expanded="false">
                            <span class="hamburger-line"></span>
                            <span class="hamburger-line"></span>
                            <span class="hamburger-line"></span>
                            <span class="sr-only">Toggle Sidebar</span>
                        </button>
                        <button id="toggle-bottom" class="header-tool-button controls-toggle" type="button" title="Show bottom controls" aria-label="Show bottom controls" aria-pressed="false">
                            Controls
                        </button>
                    </div>
                </div>
            </header>
            
            <section class="fretboard-container" aria-label="Fretboard diagrams">
                <div id="fretboard" role="region" aria-label="Interactive fretboard, strings ordered lowest to highest" tabindex="0"></div>
                <div id="current-pattern-display" class="current-pattern-display" aria-label="Selected diagram actions"></div>
            </section>
            
            <div class="slideshow-container">
                <div id="slideshow-items"></div>
            </div>
            
            <div class="pattern-generator">
                <div id="generated-patterns"></div>
            </div>
