<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#243955">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Primer</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="mini-fretboard.css">
    <link rel="stylesheet" href="primer.css">
    <script src="theme-init.js"></script>
    <script src="site.js" defer></script>
</head>
<body>
    <header class="top-header">
        <div class="top-header-content">
            <nav class="header-nav" aria-label="Main navigation"></nav>
            <div class="sidebar-toggle-container">
                <button id="sidebar-toggle" aria-expanded="false" title="Open Neck Diagram Explorer" onclick="window.location.href='fretboard.html'">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="sr-only">Open Neck Diagram Explorer</span>
                </button>
            </div>
        </div>
    </header>

    <main class="primer-app">
        <section class="primer-shell" aria-label="Primer learning workspace">
            <div class="primer-toolbar" role="toolbar" aria-label="Primer tools">
                <button class="primer-tool" type="button" data-action="stop" title="Stop all Primer audio"><span class="primer-tool-icon stop-icon" aria-hidden="true">[]</span><span>Stop</span></button>
                <button class="primer-tool" type="button" data-action="play" title="Choose a saved pattern from a DAW"><span class="primer-tool-icon" aria-hidden="true">PL</span><span>Play</span></button>
                <button class="primer-tool" type="button" data-action="read" title="Read courses, music lessons and practice material"><span class="primer-tool-icon" aria-hidden="true">RD</span><span>Read</span></button>
                <button class="primer-tool" type="button" data-action="map" title="Open the 20,000-step learning map"><span class="primer-tool-icon" aria-hidden="true">MP</span><span>Map</span></button>
                <button class="primer-tool" type="button" data-action="pattern" title="Choose a chord progression"><span class="primer-tool-icon" aria-hidden="true">PT</span><span>Pattern</span></button>
                <button class="primer-tool" type="button" data-action="mixer" title="Adjust sound and playback"><span class="primer-tool-icon" aria-hidden="true">MX</span><span>Mixer</span></button>
                <button class="primer-tool" type="button" data-action="setup" title="Adjust Primer defaults"><span class="primer-tool-icon" aria-hidden="true">CF</span><span>Setup</span></button>
                <button class="primer-tool" type="button" data-action="tuning" title="Hear and tune open strings"><span class="primer-tool-icon" aria-hidden="true">TN</span><span>Tuning</span></button>
                <button class="primer-tool" type="button" data-action="help" title="Open help and site resources"><span class="primer-tool-icon" aria-hidden="true">?</span><span>Help</span></button>
            </div>

            <div class="primer-neck-panel">
                <div class="primer-neck-caption"><span id="primer-neck-title">FRETBOARD / C MAJOR</span><span id="primer-neck-instrument">GUITAR · E A D G B E</span></div>
                <div id="primer-neck" class="primer-neck" aria-label="Current fretboard diagram"></div>
            </div>

            <section id="primer-window" class="primer-window" aria-label="Primer reader window">
                <header class="primer-window-titlebar">
                    <div class="primer-window-name"><span class="primer-book-mark" aria-hidden="true">P</span><span id="primer-window-title">Primer / First sounds</span></div>
                    <div class="primer-window-controls" aria-label="Reader window controls">
                        <button type="button" data-window="minimize" aria-label="Minimize reader">Min</button>
                        <button type="button" data-window="maximize" aria-label="Maximize reader">Max</button>
                        <button type="button" data-window="custom" aria-label="Resize reader">Custom</button>
                        <button type="button" data-window="close" aria-label="Close reader">Close</button>
                    </div>
                </header>
                <div class="primer-window-content">
                    <aside id="primer-index" class="primer-index" aria-label="Contents"></aside>
                    <article id="primer-page" class="primer-page" aria-live="polite" tabindex="-1"></article>
                </div>
                <footer class="primer-statusbar"><span id="primer-status">Ready</span><span id="primer-status-count">200 learning objectives · 20,000 steps</span></footer>
            </section>

            <div id="primer-taskbar" class="primer-taskbar" hidden>
                <button id="primer-restore" type="button">Restore Primer</button>
                <span id="primer-taskbar-state">Reader minimized</span>
            </div>
        </section>
    </main>

    <script src="music-theory-data.js"></script>
    <script src="scales-data-standard.js"></script>
    <script src="scales-data-numeric.js"></script>
    <script src="scales-data-advanced-1.js"></script>
    <script src="scales-data-advanced-2.js"></script>
    <script src="scales-data-advanced-3.js"></script>
    <script src="scales-data-advanced-4.js"></script>
    <script src="scales-data-advanced-5.js"></script>
    <script src="scales-data-advanced-6.js"></script>
    <script src="scales-data-advanced-7a.js"></script>
    <script src="scales-data-advanced-7b.js"></script>
    <script src="scales-data-advanced-8.js"></script>
    <script src="scales-data-advanced-10.js"></script>
    <script src="scales-data-advanced-11.js"></script>
    <script src="music-theory.js"></script>
    <script src="music-theory-logic.js"></script>
    <script src="music-theory-chords.js"></script>
    <script src="music-theory-descriptions.js"></script>
    <script src="audio-preview.js"></script>
    <script src="app-lessons-data.js"></script>
    <script src="courses-app.js"></script>
    <script src="progressions-app.js"></script>
    <script src="mini-fretboard.js"></script>
    <script src="primer.js"></script>
</body>
</html>
