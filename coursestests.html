<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="theme-color" content="#2c3e50">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scales Thesaurus - Tests</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="quiz.css">
    <link rel="stylesheet" href="mini-fretboard.css">
    <script src="theme-init.js"></script>
    <style>
        /* Tests page: list layout and home-style container, scoped to .tests-page */
        .tests-page h1 {
            margin: 0;
            color: var(--primary-color);
            font-family: "Arial Narrow", Arial, sans-serif;
            font-size: clamp(1.75rem, 3vw, 2.3rem);
            font-weight: 500;
            letter-spacing: -0.035em;
            line-height: 1.15;
        }
        .tests-page .home-section-heading::after { content: none; }
        .tests-page .home-section { margin-bottom: 28px; }
        .tests-intro {
            max-width: 640px;
            margin: 0 0 18px;
            color: var(--secondary-color);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .tests-page .test-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin: 0;
            border: 1px solid var(--border-color);
            border-radius: 13px;
            background: var(--card-bg);
            overflow: hidden;
        }
        .tests-page .test-list.stq-host-run { border: 0; background: transparent; overflow: visible; }
        .tests-page .stq-filterbar {
            border: 0;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            background: transparent;
            padding: 14px 16px;
        }
        .tests-page .stq-empty { margin: 0; padding: 24px 16px; border: 0; border-radius: 0; }
        .tests-page .test-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin: 0;
            padding: 16px 18px;
            border: 0;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            transform: none;
        }
        .tests-page .test-item[hidden] { display: none; }
        .tests-page .test-item:last-child { border-bottom: 0; }
        .tests-page .test-item:hover { background: color-mix(in srgb, var(--accent-color) 6%, var(--card-bg)); }
        .tests-page .test-details { flex: 1 1 auto; min-width: 0; }
        .tests-page .test-details h3 { margin: 0 0 4px; color: var(--primary-color); font-size: 1.1rem; }
        .tests-page .test-details p { margin: 0 0 8px; color: var(--secondary-color); font-size: 0.9rem; line-height: 1.45; }
        .tests-page .test-item .stq-meta { margin: 0; font-size: 0.8em; }
        .tests-page .test-item .stq-start {
            flex: 0 0 auto;
            align-self: center;
            width: auto;
            min-height: 40px;
            margin: 0;
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 0.9rem;
        }
        .tests-footer { margin-top: 8px; }
        .tests-footer a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
        }
        .tests-footer a:hover { border-color: var(--accent-color); }
        @media (max-width: 600px) {
            .tests-page .test-item { flex-direction: column; align-items: stretch; gap: 12px; padding: 14px; }
            .tests-page .test-item .stq-item-actions { width: 100%; }
            .tests-page .test-item .stq-item-actions > button { flex: 1 1 auto; align-self: auto; min-height: 40px; }
        }
    </style>
    <script src="site.js" defer></script>
</head>
<body>
    <header class="top-header">
        <div class="top-header-content">
            <nav class="header-nav" aria-label="Main navigation"></nav>
        </div>
    </header>

    <main class="home-container tests-page">
        <section class="home-section">
            <div class="home-section-heading">
                <div>
                    <p class="home-section-kicker">TIMED ASSESSMENTS</p>
                    <h1>Music Theory Tests</h1>
                </div>
            </div>
            <p class="tests-intro">
                Challenge yourself with comprehensive tests covering multiple music theory topics. Tests are timed and generated fresh from the app's theory data every attempt.
            </p>
            <div class="test-list" id="test-list">
                <!-- Test items will be populated by JavaScript -->
            </div>
        </section>

        <div class="tests-footer">
            <a href="fretboard.html">Explore the Neck Diagram Explorer</a>
        </div>
    </main>

    <script src="music-theory-data.js"></script>
    <script src="scales-data-standard.js"></script>
    <script src="scales-data-numeric.js"></script>
    <script src="scales-data-advanced-1.js"></script>
    <script src="scales-data-advanced-2.js"></script>
    <script src="scales-data-advanced-3.js"></script>
    <script src="scales-data-advanced-4.js"></script>
    <script src="scales-data-advanced-5.js"></script>
    <script src="scales-data-advanced-6.js"></script>
    <script src="scales-data-advanced-7a.js"></script>
    <script src="scales-data-advanced-7b.js"></script>
    <script src="scales-data-advanced-8.js"></script>
    <script src="scales-data-advanced-10.js"></script>
    <script src="scales-data-advanced-11.js"></script>
    <script src="music-theory.js"></script>
    <script src="music-theory-logic.js"></script>
    <script src="music-theory-chords.js"></script>
    <script src="music-theory-descriptions.js"></script>
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="mini-fretboard.js"></script>
    <script src="study-pdf.js"></script>
    <script src="quiz-engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            QuizEngine.mountList(document.getElementById('test-list'), QuizEngine.TESTS, 'test');
        });
    </script>
</body>
</html>
