<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="theme-color" content="#2c3e50">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Exams</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes.css">
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="quiz.css">
    <link rel="stylesheet" href="mini-fretboard.css">
    <style>
        /* Exams page: header and container follow home.html; exam rows are a plain list. */
        .exams-page .exams-heading { margin: 0 0 6px; color: var(--primary-color); font-family: "Arial Narrow", Arial, sans-serif; font-size: clamp(1.75rem, 3vw, 2.3rem); font-weight: 500; letter-spacing: -.035em; line-height: 1.1; text-align: left; }
        .exams-page .exams-intro { margin: 0 0 24px; max-width: 560px; color: var(--secondary-color); font-size: 1rem; line-height: 1.65; }
        #exam-list { display: flex; flex-direction: column; }
        #exam-list [hidden] { display: none !important; }
        #exam-list .stq-filterbar { margin-bottom: 12px; }
        #exam-list .exam-item { display: flex; flex-direction: row; align-items: center; gap: 16px; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--border-color); border-radius: 0; background: none; box-shadow: none; overflow: visible; }
        #exam-list .exam-item[hidden] { display: none; }
        #exam-list .exam-details { flex: 1; min-width: 0; }
        #exam-list .exam-details h3 { margin: 0 0 4px; font-size: 1.15em; color: var(--primary-color); }
        #exam-list .exam-details p { margin: 0 0 8px; font-size: .95em; color: var(--text-color); line-height: 1.5; }
        #exam-list .stq-meta { margin-top: 0; font-size: .85em; color: var(--secondary-color); }
        #exam-list .stq-start { flex-shrink: 0; align-self: center; margin: 0; padding: 8px 14px; font-size: .95em; }
        .exams-footer { margin-top: 28px; }
        @media (max-width: 768px) {
            #exam-list .exam-item { flex-wrap: wrap; align-items: flex-start; gap: 10px; }
            #exam-list .exam-details { flex-basis: 100%; }
            #exam-list .stq-start, #exam-list .stq-pdf { min-height: 36px; padding: 7px 12px; font-size: .9em; }
        }
    </style>
    <script src="site.js" defer></script>
<link rel="stylesheet" href="standalone.css">
</head>
<body>
    <header class="top-header">
        <div class="top-header-content">
            <nav class="header-nav" aria-label="Main navigation"></nav>
        </div>
    </header>

    <main class="home-container exams-page">
        <h1 class="exams-heading">Exams</h1>
        <p class="exams-intro">
            Timed, graded exams with no hints until the end. Pass to download a PDF certificate. Everything runs offline.
        </p>
        <div class="exam-list" id="exam-list"></div>
        <div class="exams-footer">
            <a href="fretboard.html" class="home-primary-link">Explore the Neck Diagram Explorer</a>
        </div>
    </main>
    <script src="music-theory-data.js"></script>
    <script src="scales-data-standard.js"></script>
    <script src="scales-data-numeric.js"></script>
    <script src="scales-data-advanced-1.js"></script>
    <script src="scales-data-advanced-2.js"></script>
    <script src="scales-data-advanced-3.js"></script>
    <script src="scales-data-advanced-4.js"></script>
    <script src="scales-data-advanced-5.js"></script>
    <script src="scales-data-advanced-6.js"></script>
    <script src="scales-data-advanced-7a.js"></script>
    <script src="scales-data-advanced-7b.js"></script>
    <script src="scales-data-advanced-8.js"></script>
    <script src="scales-data-advanced-10.js"></script>
    <script src="scales-data-advanced-11.js"></script>
    <script src="music-theory.js"></script>
    <script src="music-theory-logic.js"></script>
    <script src="music-theory-chords.js"></script>
    <script src="music-theory-descriptions.js"></script>
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="mini-fretboard.js"></script>
    <script src="study-pdf.js"></script>
    <script src="quiz-engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            QuizEngine.mountList(document.getElementById('exam-list'), QuizEngine.EXAMS, 'exam');
        });
    </script>
</body>
</html>
